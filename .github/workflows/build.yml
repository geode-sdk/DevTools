name: Build Geode Mod

on:
  workflow_dispatch:
  pull_request:
  push:
  #  branches:
  #    - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - target: win
        - target: macm1
        - target: macintel
        - target: ios
        # - target: android32
        # - target: android64

    name: Build ${{ matrix.config.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: geode-sdk/build-geode-mod-docker@main
        with:
          target: ${{ matrix.config.target }}
          sdk: nightly
          upload: true

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod-docker/merge@main
        with:
          upload: true

